<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pergunta 7 - Kahoot</title>
</head>
<body>

  <header>
    <p>Jogador: <strong id="player-display"></strong> | Pontuação: <strong id="score-display">0</strong></p>
  </header>

  <hr>

  <main>
    <h2>Pergunta 7 de 7</h2>
    <h3>Onde fica armazenado o histórico do navegador no JavaScript no exemplo acima?</h3>

    <button onclick="responder(false)">A) no Cookies</button><br><br>
    <button onclick="responder(false)">B) no SessionStorage</button><br><br>
    <button onclick="responder(true)">C) no LocalStorage</button><br><br>
    <button onclick="responder(false)">D) no Server-side</button>
  </main>

  <script>
    const player = localStorage.getItem('kahoot_player') || 'Convidado';
    let score = parseInt(localStorage.getItem('kahoot_score') || '0');

    document.getElementById('player-display').textContent = player;
    document.getElementById('score-display').textContent = score;

    function responder(correta) {
      if (correta) {
        score += 100;
        localStorage.setItem('kahoot_score', score);
        alert('Resposta Correta! +100 pontos');
      } else {
        alert('Resposta Incorreta!');
      }
      // Após a última pergunta, vai para o ranking
      window.location.href = 'ranking.html';
    }
  </script>

</body>
</html>
