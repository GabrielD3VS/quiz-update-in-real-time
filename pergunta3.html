<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pergunta 3 - Kahoot</title>
</head>
<body>

  <header>
    <p>Jogador: <strong id="player-display"></strong> | Pontuação: <strong id="score-display">0</strong></p>
  </header>

  <hr>

  <main>
    <h2>Pergunta 3 de 7</h2>
    <h3>Qual linguagem traz interatividade para o navegador?</h3>

    <button onclick="responder(false)">A) HTML</button><br><br>
    <button onclick="responder(false)">B) CSS</button><br><br>
    <button onclick="responder(true)">C) JavaScript</button><br><br>
    <button onclick="responder(false)">D) C#</button>
  </main>

  <script>
    const player = localStorage.getItem('kahoot_player') || 'Convidado';
    let score = parseInt(localStorage.getItem('kahoot_score') || '0');

    document.getElementById('player-display').textContent = player;
    document.getElementById('score-display').textContent = score;

    function responder(correta) {
      if (correta) {
        score += 100;
        localStorage.setItem('kahoot_score', score);
        alert('Resposta Correta! +100 pontos');
      } else {
        alert('Resposta Incorreta!');
      }
      window.location.href = 'pergunta4.html';
    }
  </script>

</body>
</html>
